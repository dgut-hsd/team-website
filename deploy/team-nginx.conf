# team-website — 子路径 /team/ 静态托管
# 把下面这段插入 /etc/nginx/sites-available/smart-tender 的默认 server 块内（倒数第二个 } 之前）。
# 需先构建好产物到 /srv/projects/team-website/dist（见 deploy/install.sh）。
#
# 说明：
#   - alias 指向 dist 目录，把 /team/* 映射到 dist/*；
#   - try_files 末尾 /team/index.html 做 SPA 兜底（/team/members 等直接访问也能进首页再切换）；
#   - 顶层已有 location ~* \.mjs$ { default_type application/javascript; }，
#     所以 .mjs 模块加载无需重复配置。
#
# 改完后执行：sudo nginx -t && sudo systemctl reload nginx

    # team-website 前端静态(子路径 /team/)
    location ^~ /team/ {
        alias /srv/projects/team-website/dist/;
        try_files $uri $uri/ /team/index.html;
    }
